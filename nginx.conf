server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript image/svg+xml text/css;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /manifest.json {
        alias /srv/data/manifest.json;
        add_header Cache-Control "no-store";
    }

    location = /regions.json {
        alias /srv/data/regions.json;
        add_header Cache-Control "no-store";
    }

    location ~ ^/regions/([a-z0-9-]+)\.json$ {
        alias /srv/data/regions/$1.json;
        add_header Cache-Control "no-store";
    }

    location ~ ^/atak/vector/([a-z0-9-]+)\.mbtiles$ {
        alias /srv/data/$1.mbtiles;
        default_type application/vnd.mapbox-vector-tile;
        add_header Content-Disposition 'attachment; filename="map-room-$1-vector.mbtiles"';
        add_header Cache-Control "private, no-transform";
    }

    location ~ ^/styles/([a-z0-9-]+)/atak-sprite\.json$ {
        alias /srv/styles/$1/atak-sprite.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/styles/([a-z0-9-]+)/atak-sprite\.png$ {
        alias /srv/styles/$1/atak-sprite.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/browser-styles/all-([a-z0-9-]+)/style\.json$ {
        alias /srv/styles/collections/browser/$1.json;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/styles/[a-z0-9-]+/(style\.json|sprite(?:@2x)?\.(?:json|png))$ {
        proxy_pass http://tiles:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ ^/(styles|data|fonts)/ {
        proxy_pass http://tiles:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://tiles:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20G;
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
