name: Bug report
description: Report reproducible Map Room behavior
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands and sanitized logs. Do not include credentials, private map data, or deployment addresses.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Map Room version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, browser, and relevant network details.
    validations:
      required: true
  - type: textarea
    id: atak
    attributes:
      label: ATAK evidence, if applicable
      description: ATAK version, Android version, device model, import path, connected result, cache result, and disconnected result.
