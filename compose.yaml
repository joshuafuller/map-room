services:
  # web/vendor and data/fonts are deliberately untracked. Provision them before the
  # stack starts so a clean checkout works from `docker compose up` alone, with no
  # host toolchain. Idempotent: a second run exits immediately.
  setup:
    image: node:24-alpine
    # Runs as root on purpose. The checkout can be owned by any uid (a CI runner
    # uses 1001), so this hands the provisioned files to MAP_ROOM_UID/GID itself
    # rather than requiring the two to match.
    working_dir: /workspace
    environment:
      MAP_ROOM_DATA_DIR: /workspace/data
      MAP_ROOM_UID: ${MAP_ROOM_UID:-1000}
      MAP_ROOM_GID: ${MAP_ROOM_GID:-1000}
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./package.json:/workspace/package.json:ro
      - ./package-lock.json:/workspace/package-lock.json:ro
      - ./scripts:/workspace/scripts:ro
      - ./web/vendor:/workspace/web/vendor
      - ./data:/workspace/data
    entrypoint: ["/bin/sh", "/workspace/scripts/provision-assets.sh"]

  tiles:
    build: .
    user: "${MAP_ROOM_UID:-1000}:${MAP_ROOM_GID:-1000}"
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      TILESERVER_GL_ALLOWED_HOSTS: ${MAP_ROOM_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MAP_ROOM_DEFAULT_REGION: ${MAP_ROOM_DEFAULT_REGION:-}
      MAP_ROOM_BUILD_MEMORY: ${MAP_ROOM_BUILD_MEMORY:-2g}
    volumes:
      - ./data:/data/archive
      - ./data/fonts:/data/fonts:ro
      - ./styles:/data/styles
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: nginx:1.29.5-alpine
    depends_on:
      tiles:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./data:/srv/data:ro
      - ./styles:/srv/styles:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
