services:
  tiles:
    build: .
    user: "${MAP_ROOM_UID:-1000}:${MAP_ROOM_GID:-1000}"
    environment:
      TILESERVER_GL_ALLOWED_HOSTS: ${MAP_ROOM_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MAP_ROOM_DEFAULT_REGION: ${MAP_ROOM_DEFAULT_REGION:-}
      MAP_ROOM_BUILD_MEMORY: ${MAP_ROOM_BUILD_MEMORY:-2g}
    volumes:
      - ./data:/data/archive
      - ./data/fonts:/data/fonts:ro
      - ./styles:/data/styles
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: nginx:1.29.5-alpine
    depends_on:
      tiles:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./data:/srv/data:ro
      - ./styles:/srv/styles:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
