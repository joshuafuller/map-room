services:
  tiles:
    image: maptiler/tileserver-gl:v5.6.0
    command:
      - --config
      - /data/config.json
      - --public_url
      - http://localhost:8088
    volumes:
      - ./config.json:/data/config.json:ro
      - ./data:/data/archive:ro
      - ./data/fonts:/data/fonts:ro
      - ./styles:/data/styles:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/data/osm.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: nginx:1.29.5-alpine
    depends_on:
      tiles:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./data:/srv/data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
