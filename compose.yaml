services:
  configure:
    image: node:24-alpine
    command:
      - node
      - /app/scripts/configure-regions.mjs
    environment:
      MAP_ROOM_DATA_DIR: /data/archive
      MAP_ROOM_STYLE_DIR: /data/styles
      MAP_ROOM_BASE_CONFIG: /app/config.json
      MAP_ROOM_DEFAULT_REGION: ${MAP_ROOM_DEFAULT_REGION:-california}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./maintainer:/app/maintainer:ro
      - ./scripts:/app/scripts:ro
      - ./data:/data/archive
      - ./styles:/data/styles

  tiles:
    image: maptiler/tileserver-gl:v5.6.0
    depends_on:
      configure:
        condition: service_completed_successfully
    command:
      - --config
      - /data/config.json
    environment:
      TILESERVER_GL_ALLOWED_HOSTS: ${MAP_ROOM_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./data/runtime/config.json:/data/config.json:ro
      - ./data:/data/archive:ro
      - ./data/fonts:/data/fonts:ro
      - ./styles:/data/styles:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/styles/daylight/style.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: nginx:1.29.5-alpine
    depends_on:
      tiles:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./data:/srv/data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
